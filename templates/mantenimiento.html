<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sitio en mantenimiento | Grupo Dewill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e60000; --primary-dark: #cc0000; --secondary: #081c3b; --secondary-light: #112c5b; --text-muted: #5a6478; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            font-family: 'Inter', sans-serif; color: #1a1d26;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-light) 100%);
        }
        .card {
            width: 100%; max-width: 560px; background: #fff; border-radius: 20px; text-align: center;
            padding: 2.75rem 2rem 2.25rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); border-top: 6px solid var(--primary);
        }
        .logo { max-height: 58px; max-width: 80%; margin-bottom: 1.75rem; }
        .icon {
            width: 76px; height: 76px; margin: 0 auto 1.5rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #ffe5e7; color: var(--primary); font-size: 2rem;
        }
        h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 2rem; line-height: 1.15; color: var(--secondary); margin-bottom: 0.9rem; }
        .msg { color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; white-space: pre-line; margin-bottom: 1.75rem; }
        .help { border-top: 1px solid #e6e9f0; padding-top: 1.5rem; }
        .help p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.9rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.4rem; border-radius: 9999px;
            font-weight: 600; font-size: 0.95rem; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15); }
        .btn-wa { background: #25d366; color: #fff; }
        .btn-outline { border: 2px solid var(--secondary); color: var(--secondary); }
        .foot { margin-top: 1.5rem; font-size: 0.8rem; color: #8a93a6; }
        @media (max-width: 480px) { .card { padding: 2.25rem 1.25rem 1.75rem; } h1 { font-size: 1.6rem; } .btn { width: 100%; justify-content: center; } }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="{{ url_for('static', filename='assets/logo.png') }}" alt="Grupo Dewill S.A.C.">
        <div class="icon"><i class="fas fa-tools" aria-hidden="true"></i></div>
        <h1>Sitio en mantenimiento</h1>
        <p class="msg">{{ maintenance_message }}</p>
        <div class="help">
            <p>¿Necesitas atención mientras tanto? Contáctanos:</p>
            <div class="actions">
                <a class="btn btn-wa" href="https://wa.me/{{ site.get('whatsapp', '51983461199') }}?text=Hola%20Grupo%20Dewill%2C%20necesito%20informaci%C3%B3n" target="_blank" rel="noopener">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a class="btn btn-outline" href="mailto:{{ site.get('email') or 'ventas@grupodewill.com' }}">
                    <i class="fas fa-envelope"></i> {{ site.get('email') or 'ventas@grupodewill.com' }}
                </a>
            </div>
        </div>
        <p class="foot">Gracias por tu paciencia — Grupo Dewill S.A.C.</p>
    </main>
</body>
</html>
